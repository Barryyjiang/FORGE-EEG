[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eegbench"
version = "0.1.0"
description = "Electrode-subset / wearable-EEG benchmark built on MOABB"
requires-python = ">=3.11"
dependencies = [
    "moabb",
    "braindecode",
    "mne",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
]

[tool.setuptools.packages.find]
include = ["eegbench*"]
